<style>
  * { box-sizing: border-box; }
  
  html, body, * {
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-user-drag: none;
    -webkit-touch-callout: none;
  }
  input, textarea {
    -webkit-user-select: text;

    -ms-user-select: text;
    user-select: text;
  }

  html, body {

  }

  /* ── 오디오 재생 중 중앙에서 퍼지는 파동 배경 ── */
  #ripple-bg {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 0;
    background: #fafafa;
    overflow: hidden;
    transition: background-color .6s ease;
  }

    position: absolute; top: 50%; left: 50%;
    width: 0; height: 0;
    border-radius: 50%;

    transform: translate(-50%, -50%);

  }

  #ripple-bg span:nth-child(2) { animation-delay: 0.6s; }
  #ripple-bg span:nth-child(3) { animation-delay: 1.2s; }
  @keyframes rippleExpand {
    0%   { width: 0;     height: 0;     opacity: .55; border-width: 6px; }
    70%  { opacity: .15; }
    100% { width: 1600px; height: 1600px; opacity: 0; border-width: 1px; }

/* ── 화면 이동 히스토리 스택 ── */
let historyStack = ['screen-home'];

function renderScreen(id) {
  Object.values(screens).forEach(el => el.classList.remove('active'));
  screens[id].classList.add('active');
  document.getElementById('btn-header-back').disabled = (historyStack.length <= 1) || (id === 'screen-complete');
}
function goTo(id) {
  historyStack.push(id);
  renderScreen(id);
}
function goBack() {
  if (historyStack.length <= 1) return;
  historyStack.pop();
  renderScreen(historyStack[historyStack.length - 1]);
}
function goHome() {
  historyStack = ['screen-home'];
  renderScreen('screen-home');
}

document.getElementById('btn-header-back').addEventListener('click', goBack);
document.getElementById('btn-header-home').addEventListener('click', goHome);

function parseLine(line) {
  const [rest1, sentenceMean] = splitOnce(line, '####');
  const [rest2, sentence]     = splitOnce(rest1, '###');
  const [word, mean]          = splitOnce(rest2, '##');
  return { word: word.trim(), mean: mean.trim(), sentence: (sentence||'').trim(), sentenceMean: (sentenceMean||'').trim() };
}
function splitOnce(str, delim) {
  const idx = str.indexOf(delim);
  if (idx === -1) return [str, ''];
  return [str.slice(0, idx), str.slice(idx + delim.length)];
}

function fetchTextViaXHR(path) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('GET', path, true);
    xhr.onload = () => {
      // file:// 환경에서는 성공해도 status가 0으로 나오는 경우가 있어 함께 허용
      if (xhr.status === 200 || xhr.status === 0) {
        resolve(xhr.responseText);
      } else {
        reject(new Error(`HTTP ${xhr.status}`));
      }
    };
    xhr.onerror = () => reject(new Error('파일을 읽는 중 네트워크 오류가 발생했습니다.'));
    xhr.send();
  });
}

async function loadWords() {
  try {
    const text = await fetchTextViaXHR(`${server}words/words_with_mean.txt`);
    allWords = text.split(/\r?\n/).filter(l => l.trim() !== '').map(parseLine);
    buildHomeGrid();
  } catch (err) {
    document.getElementById('day-grid').innerHTML =
      `<div style="grid-column:1/-1;color:#c23bd0;font-size:1.2rem;padding:20px;">
         단어 파일을 불러오지 못했습니다: ${err.message}<br>
         (words/words_with_mean.txt 경로/패키징을 확인하세요)
       </div>`;
    console.log('단어 로딩 실패:', err);
  }
}

function buildHomeGrid() {
  const grid = document.getElementById('day-grid');
  grid.innerHTML = '';
  for (let d = 1; d <= TOTAL_DAYS; d++) {
    const groupIdx = Math.floor((d - 1) / 10);
    const card = document.createElement('div');
    card.className = `day-card group-${groupIdx}`;
    card.textContent = `Day ${d}`;
    card.tabIndex = 0;
    card.addEventListener('click', () => openDay(d));
    // card.addEventListener('keydown', e => { if (e.keyCode === 13) openDay(d); });
    grid.appendChild(card);
  }
}

function openDay(day) {
  currentDay = day;
  dayWords = allWords.slice((day - 1) * WORDS_PER_DAY, day * WORDS_PER_DAY);
  document.getElementById('day-menu-title').textContent = `Day ${day}`;
  goTo('screen-day-menu');
}

function setAudioPlaying(playing) {
  isAudioPlaying = playing;
  document.body.classList.toggle('audio-playing', playing);
 
  if (audioWatchdogTimer) {
    clearTimeout(audioWatchdogTimer);
    audioWatchdogTimer = null;
  }
 
  if (playing) {

      setAudioPlaying(false); // 클릭이 다시 먹히도록 강제 복구
    }, AUDIO_WATCHDOG_MS);
  }
}

function playSound(path) {
    return new Promise((resolve) => {
        const startedAt = Date.now();
        const stopEffect = () => {
            const remaining = Math.max(0, MIN_EFFECT_MS - (Date.now() - startedAt));
            setTimeout(() => {
                setAudioPlaying(false);
                cleanup();
                resolve();
            }, remaining);
        };

        const cleanup = () => {
            audioPlayer.onended = null;
            audioPlayer.onerror = null;
        };

        // 이전 재생 중이면 중지
        audioPlayer.pause();
        // 재생 위치 초기화
        audioPlayer.currentTime = 0;
        // 새로운 파일 지정
        audioPlayer.src = path;
        
        setAudioPlaying(true);
        
        audioPlayer.onended = stopEffect;
        audioPlayer.onerror = () => {
            console.log("오디오 재생 오류", path);
            stopEffect();
        };

        audioPlayer.load();

        const p = audioPlayer.play();

        if (p) {
            p.catch(err => {
                console.log(err);
                stopEffect();
            });
        }
    });
}


function playWordStep(word, n) {
  playSound(`${server}sound/${word}_${n}.mp3`);
}

let studyIndex = 0;
let studyStep = 0;
let studyList = [];
let studySessionStart = 0;

const studyWordEl = document.getElementById('study-word');
const studyMeanEl = document.getElementById('study-mean');
const studySubEl  = document.getElementById('study-sub');
const studyScreenEl = document.getElementById('screen-study');

function renderWordChars(el, text) {
  el.innerHTML = '';
  [...text].forEach((ch, idx) => {
    const span = document.createElement('span');
    span.className = 'word-str';
    span.dataset.index = idx;
    span.textContent = ch;
    el.appendChild(span);
  });
}

function sentenceWordsHTML(sentence) {
  return sentence.split(' ').map((w, idx) =>
    `<span class="word-str" data-index="${idx}">${w}</span>`
  ).join(' ');
}

function startStudy(words) {
  studyList = words;
  studyIndex = 0;
  studyStep = 0;
  studySessionStart = Date.now();
  goTo('screen-study');
  renderStudyStep0();
}

function renderStudyStep0() {
  const w = studyList[studyIndex];
  renderWordChars(studyWordEl, w.word);
  studyMeanEl.textContent = '　';
  studySubEl.innerHTML = '　';
}

studyScreenEl.addEventListener('click', () => {
  runSpeak();
});

async function runSpeak() {
  
  if (isAudioPlaying || !isCanClick) return;
  const w = studyList[studyIndex];
  studyStep++;

  switch (studyStep) {
    case 1:
      playWordStep(w.word, 1);
      break;
    case 2:
      playWordStep(w.word, 2);
      studyMeanEl.textContent = `뜻은?`;
      break;
    case 3:
      // setTimeout(() => { studyMeanEl.textContent = w.mean; }, 1);
      studyMeanEl.textContent = w.mean;
      playWordStep(w.word, 3);
      break;
    case 4:
      playWordStep(w.word, 4);
      break;
    case 5:
      studyWordEl.textContent = '?';
      studyMeanEl.textContent = '스펠링은?';
      playWordStep(w.word, 5);

const testPromptEl = document.getElementById('test-prompt');
const testInstructionEl = document.getElementById('test-instruction');
const testInputEl = document.getElementById('test-input');
const testSubmitEl = document.getElementById('test-submit');
const testFeedbackEl = document.getElementById('test-feedback');

let testQueue = [];
let testIndex = 0;
let testMode = 'day';
let testCorrectCount = 0;
let testSessionStart = 0;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildTestQueue(words) {
  const q = [];
  words.forEach(w => {
    q.push({ ...w, direction: 'w2m' });
    q.push({ ...w, direction: 'm2w' });
  });
  return shuffle(q);
}

function startTest(words, mode) {
  testMode = mode;
  testQueue = buildTestQueue(words);
  testIndex = 0;
  testCorrectCount = 0;
  testSessionStart = Date.now();
  goTo('screen-test');
  renderTestItem();
}


function renderTestItem() {
  const item = testQueue[testIndex];
  testInputEl.value = '';
  if (item.direction === 'w2m') {
    testPromptEl.textContent = item.word;
    testInstructionEl.textContent = '뜻을 입력해주세요';
  } else {
    testPromptEl.textContent = item.mean;
    testInstructionEl.textContent = '영어 단어를 입력해주세요';
  }
  testInputEl.focus();
}

testSubmitEl.addEventListener('click', submitTestAnswer);
// testInputEl.addEventListener('keydown', e => { if (e.keyCode === 13) submitTestAnswer(); });

document.getElementById('screen-test').addEventListener('click', (e) => {
  if (e.target === testInputEl || e.target === testSubmitEl) return;
  submitTestAnswer();
});

function normalize(s) {
  return (s || '')
    .trim()
    .toLowerCase()
    .replace(/[~!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?`]/g, '')
    .replace(/\s+/g, '')
    .replace(/을/g, '를');
}

async function submitTestAnswer() {
  const item = testQueue[testIndex];
  const answer = testInputEl.value;
  let correct;
  if (item.direction === 'w2m') {
    correct = normalize(answer) === normalize(item.mean);
  } else {
    correct = normalize(answer) === normalize(item.word);
  }

  await saveTestResult(item.word, item.direction, correct);
  
  if (correct) {
    testCorrectCount++;
    playSound(`${server}sound/correct.mp3`);
  } else {
    if (item.direction === 'w2m') {
      playSound(`${server}sound/${item.word}_3.mp3`);
    } else {
      playSound(`${server}sound/${item.word}_1.mp3`);
    }
  }

  testFeedbackEl.className = correct ? 'correct' : 'incorrect';
  testFeedbackEl.textContent = correct ? '정답입니다!' : `오답입니다. 정답: ${item.direction === 'w2m' ? item.mean : item.word}`;
  testFeedbackEl.style.display = 'flex';
}

testFeedbackEl.addEventListener('click', () => {
  if (isAudioPlaying) return;

  testFeedbackEl.style.display = 'none';
  testIndex++;
  if (testIndex >= testQueue.length) {
    const stepLabel = testMode === 'random' ? 'Random' : `Day ${currentDay}`;
    const scoreText = `${testCorrectCount}/${testQueue.length}`;
    saveHistoryRecord('test', stepLabel, scoreText, testSessionStart);
    showComplete(`테스트 완료! 점수: ${scoreText}`);
    return;
  }
  renderTestItem();
});

async function startRandom() {
  const stats = await getAllStats();
  const pool = allWords.map(w => {
    const s = stats[w.word] || { correct: 0, wrong: 0 };
    const weight = 1 + s.wrong * 2 - Math.min(s.correct, 5) * 0.3;
    return { ...w, weight: Math.max(weight, 0.3) };
  });

  const picked = weightedPickWithoutReplacement(pool, Math.min(20, pool.length));
  startTest(picked, 'random');
}

function weightedPickWithoutReplacement(items, n) {
  const pool = [...items];
  const result = [];
  for (let i = 0; i < n && pool.length > 0; i++) {
    const total = pool.reduce((sum, it) => sum + it.weight, 0);
    let r = Math.random() * total;
    let idx = 0;
    for (; idx < pool.length; idx++) {
      r -= pool[idx].weight;
      if (r <= 0) break;
    }
    idx = Math.min(idx, pool.length - 1);
    result.push(pool[idx]);
    pool.splice(idx, 1);
  }
  return result;
}

function showComplete(message) {
  document.getElementById('complete-text').textContent = message || '완료했습니다!';
  goTo('screen-complete');

let dbPromise = null;
function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open('wordAppDB', 2);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('results')) {
        db.createObjectStore('results', { keyPath: 'key' });
      }
      if (!db.objectStoreNames.contains('history')) {
        const store = db.createObjectStore('history', { keyPath: 'id', autoIncrement: true });
        store.createIndex('by_timestamp', 'timestamp');
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}

async function saveHistoryRecord(type, step, score, startedAt, isError) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('history', 'readwrite');
    tx.objectStore('history').add({
      type, step, score: score || null,
      startedAt: startedAt || Date.now(),
      timestamp: Date.now(), // 완료(또는 오류) 시각
      error: !!isError
    });
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

const HISTORY_PAGE_SIZE = 50;
let historyOffset = 0;
 
async function getHistoryPage(offset, limit) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('history', 'readonly');
    const idx = tx.objectStore('history').index('by_timestamp');
    const results = [];
    let skipped = 0;
    const req = idx.openCursor(null, 'prev'); // 최신순
    req.onsuccess = (e) => {
      const cursor = e.target.result;
      if (!cursor) { resolve(results); return; }
      if (skipped < offset) { skipped++; cursor.continue(); return; }
      if (results.length < limit) {
        results.push(cursor.value);
        cursor.continue();
      } else {
        resolve(results);
      }
    };
    req.onerror = () => reject(req.error);
  });
}
 
function formatHistoryTime(ts) {
  const d = new Date(ts);
  return d.toLocaleString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
}
 
async function renderHistoryPage() {
  const records = await getHistoryPage(historyOffset, HISTORY_PAGE_SIZE);
  const listEl = document.getElementById('history-list');
  listEl.innerHTML = records.map(r => `
    <div class="history-row">
      <span class="h-type">${r.type === 'study' ? '공부' : '테스트'}</span>
      <span class="h-step">${r.step}</span>
      <span class="h-score">${r.score || '-'}</span>
      <span class="h-time">${formatHistoryTime(r.startedAt || r.timestamp)} ~ ${formatHistoryTime(r.timestamp)}</span>
    </div>`).join('') || '<div style="padding:30px;color:#999;">기록이 없습니다.</div>';
  document.getElementById('btn-history-prev').disabled = historyOffset === 0;
  document.getElementById('btn-history-next').disabled = records.length < HISTORY_PAGE_SIZE;
}
 
function openHistory() {
  historyOffset = 0;
  goTo('screen-history');
  renderHistoryPage();
}
document.getElementById('btn-header-history').addEventListener('click', openHistory);
document.getElementById('btn-history-next').addEventListener('click', () => {
  historyOffset += HISTORY_PAGE_SIZE;
  renderHistoryPage();
});
document.getElementById('btn-history-prev').addEventListener('click', () => {
  historyOffset = Math.max(0, historyOffset - HISTORY_PAGE_SIZE);
  renderHistoryPage();
});

async function saveTestResult(word, direction, correct) {
  const db = await openDB();
  const key = `${word}::${direction}`;
  return new Promise((resolve, reject) => {
    const tx = db.transaction('results', 'readwrite');
    const store = tx.objectStore('results');
    const getReq = store.get(key);
    getReq.onsuccess = () => {
      const existing = getReq.result || { key, word, direction, correct: 0, wrong: 0 };
      if (correct) existing.correct++; else existing.wrong++;
      store.put(existing);
    };
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function getAllStats() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('results', 'readonly');
    const store = tx.objectStore('results');
    const req = store.getAll();
    req.onsuccess = () => {
      const stats = {};
      req.result.forEach(row => {
        if (!stats[row.word]) stats[row.word] = { correct: 0, wrong: 0 };
        stats[row.word].correct += row.correct;
        stats[row.word].wrong += row.wrong;
      });
      resolve(stats);
    };
    req.onerror = () => reject(req.error);
  });
}

const globalErrorEl = document.getElementById('global-error');

function showGlobalError(message) {
  globalErrorMsgEl.textContent = message;
  globalErrorEl.style.display = 'flex';
}

  globalErrorEl.style.display = 'none';
});
 
function recordErrorInHistory() {
  const studyActive = screens['screen-study'].classList.contains('active');
  const testActive = screens['screen-test'].classList.contains('active');
 
  if (studyActive) {
    saveHistoryRecord('study', `Day ${currentDay}`, null, studySessionStart, true);
  } else if (testActive) {
    const stepLabel = testMode === 'random' ? 'Random' : `Day ${currentDay}`;
    const scoreText = `${testCorrectCount}/${testIndex}`; // 오류 시점까지의 진행 상황
    saveHistoryRecord('test', stepLabel, scoreText, testSessionStart, true);
  }
}
 
window.addEventListener('error', (event) => {
  const msg = event.error ? (event.error.message || String(event.error)) : event.message;
  showGlobalError(`${msg}\n(${event.filename || ''}:${event.lineno || ''})`);
  recordErrorInHistory();
});
 
window.addEventListener('unhandledrejection', (event) => {
  const reason = event.reason;
  const msg = reason && reason.message ? reason.message : String(reason);
  showGlobalError(`처리되지 않은 오류: ${msg}`);
  recordErrorInHistory();
});
